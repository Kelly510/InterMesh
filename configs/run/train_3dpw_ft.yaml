seed: 42
model: inter_mesh

pretrain: True
pretrain_path: 'weights/inter_mesh/intermesh_stage1.bin'
resume: False

num_epochs: 4
save_and_eval_epoch: 1
least_eval_epoch: 0
sat_gt_epoch: 0
# lr
lr: 1.0e-5
lr_encoder_names: ["encoder"]
lr_encoder: 1.0e-5
# optimizer AdamW
optimizer: 'adamw'
weight_decay: 0.0001
num_warmup_steps: 0
lr_scheduler: 'cosine'
aux_loss: True

losses: ['confs','poses','betas','boxes','j3ds','j2ds','depths','scale_map']
weight_dict: {'confs':2.,'poses':2.,'betas':2.,'boxes':2., 'giou':2., 'j3ds':10.,'j2ds':40.,'depths':0., 'map_confs': 2., 'map_scales': 2.}
detach_j3ds: False

# matcher
set_cost_conf: 1
set_cost_bbox: 1
set_cost_giou: 1
set_cost_kpts: 20

# train aug
aug_cfg:
  rot_range: [-15, 15]
  scale_range: [1., 2.]
  flip_ratio: 0.5

train_datasets_used: ['3dpw','bedlam','agora']
train_datasets_split: ['train','train_1fps','train']
train_datasets_ds_rate: [1,4,1]
train_batch_size: 12
train_num_workers: 8

eval_datasets_used: ['3dpw']
eval_datasets_split: ['test']
eval_vis_num: 0
conf_thresh: [0.3]
eval_batch_size: 24
eval_num_workers: 8
distributed_eval: True