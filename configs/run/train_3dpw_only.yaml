seed: 42
model: inter_mesh

pretrain: False
pretrain_path: ''
resume: True

num_epochs: 10
save_and_eval_epoch: 1
least_eval_epoch: 0
sat_gt_epoch: 0
# lr
lr: 1.0e-5
lr_encoder_names: ["encoder"]
lr_encoder: 1.0e-5
# optimizer AdamW
optimizer: 'adamw'
weight_decay: 0.0001
num_warmup_steps: 0
lr_scheduler: 'cosine'
aux_loss: True

losses: ['confs','poses','betas','boxes','j3ds','j2ds','depths','scale_map']
weight_dict: {'confs':4.,'poses':5.,'betas':3.,'boxes':2., 'giou':2., 'j3ds':8.,'j2ds':40.,'depths':0.5, 'map_confs': 4., 'map_scales': 4.}
detach_j3ds: False

# matcher
set_cost_conf: 1
set_cost_bbox: 1
set_cost_giou: 1
set_cost_kpts: 20

# train aug
aug_cfg:
  rot_range: [-15, 15]
  scale_range: [1., 2.]
  flip_ratio: 0.5

train_datasets_used: ['3dpw','bedlam','agora']
train_datasets_split: ['train','train_1fps','train']
train_datasets_ds_rate: [1,4,1]
train_batch_size: 20
train_num_workers: 8

eval_datasets_used: ['3dpw', 'hi4d']
eval_datasets_split: ['test', 'test']
eval_vis_num: 0
conf_thresh: [0.3]
eval_batch_size: 40
eval_num_workers: 8
distributed_eval: True